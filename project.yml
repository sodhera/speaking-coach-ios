name: SpeakingCoach
options:
  bundleIdPrefix: com.sodhera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 6LYZDNCM4M
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "18"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    majorVersion: 5.0.0
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    majorVersion: 2.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    majorVersion: 3.0.0
targets:
  SpeakingCoach:
    type: application
    platform: iOS
    sources:
      - path: SpeakingCoach
        excludes: ["*.entitlements"]
      - path: Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: ElevenLabs
        product: ElevenLabs
      - package: PostHog
        product: PostHog
      - target: SpeakingCoachMonitor
      - target: SpeakingCoachShieldConfig
      - target: SpeakingCoachShieldAction
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        # Screen Time is a device capability; the simulator build leaves it
        # out so it signs without the Family Controls profile (as SleepBlock).
        CODE_SIGN_ENTITLEMENTS: SpeakingCoach/SpeakingCoach.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": SpeakingCoach/SpeakingCoach-device.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.speakingcoach
        PRODUCT_NAME: Speaking Coach
        PRODUCT_MODULE_NAME: SpeakingCoach
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpeakingCoach/Info.plist
    configFiles:
      Debug: PostHogConfig.xcconfig
      Release: PostHogConfig.xcconfig
    info:
      path: SpeakingCoach/Info.plist
      properties:
        CFBundleDisplayName: Speaking Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Speaking Coach uses your microphone only while you practice, so your partner can hear you and give feedback on your words.
        PostHogProjectToken: $(POSTHOG_PROJECT_TOKEN)
        PostHogHost: $(POSTHOG_HOST)
        UIAppFonts:
          - DMSans.ttf
          - DMSans-Italic.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLName: com.sodhera.speakingcoach.auth
            CFBundleURLSchemes: [com.sodhera.speakingcoach, dating-coach]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  SpeakingCoachMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: SpeakingCoachMonitor
        excludes: ["*.entitlements"]
      - path: Shared
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.speakingcoach.block-monitor
        INFOPLIST_FILE: SpeakingCoachMonitor/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SpeakingCoachMonitor/SpeakingCoachMonitor.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": SpeakingCoachMonitor/SpeakingCoachMonitor-device.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  SpeakingCoachShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: SpeakingCoachShieldConfig
        excludes: ["*.entitlements"]
      - path: Shared
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
      - sdk: DeviceActivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.speakingcoach.shield-config
        INFOPLIST_FILE: SpeakingCoachShieldConfig/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SpeakingCoachShieldConfig/SpeakingCoachShieldConfig.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": SpeakingCoachShieldConfig/SpeakingCoachShieldConfig-device.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  SpeakingCoachShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: SpeakingCoachShieldAction
        excludes: ["*.entitlements"]
      - path: Shared
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.speakingcoach.shield-action
        INFOPLIST_FILE: SpeakingCoachShieldAction/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SpeakingCoachShieldAction/SpeakingCoachShieldAction.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": SpeakingCoachShieldAction/SpeakingCoachShieldAction-device.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  SpeakingCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeakingCoachTests
    dependencies:
      - target: SpeakingCoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.speakingcoach.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Speaking Coach.app/Speaking Coach"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SpeakingCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpeakingCoachUITests
    dependencies:
      - target: SpeakingCoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sodhera.speakingcoach.uitests
        TEST_TARGET_NAME: SpeakingCoach
schemes:
  SpeakingCoach:
    build:
      targets:
        SpeakingCoach: all
        SpeakingCoachTests: [test]
        SpeakingCoachUITests: [test]
    test:
      targets:
        - SpeakingCoachTests
        - SpeakingCoachUITests
